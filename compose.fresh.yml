name: dia-darma-fresh

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/app/deploy/darma-fresh/runtime_entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8000"
    networks:
      default:
      forosh_edge:
        aliases:
          - forosh-web

  sister-digikala:
    build:
      context: .
      dockerfile: deploy/darma-fresh/Dockerfile.sister-sales
    restart: unless-stopped
    environment:
      SALES_DB_PATH: /data/sales.sqlite3
      SALES_ADMIN_USER: bridge
      SALES_ADMIN_PASSWORD: ${SALES_ADMIN_PASSWORD:?Set the unique sister sales password}
      SALES_START_EMPTY_STOCK: "1"
      SALES_MASTER_STRICT: "1"
    volumes:
      - sister_sales_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8018/daily-sales/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  sister_sales_data:

networks:
  forosh_edge:
    external: true
    name: forosh_edge
