<div class="card h-100"><div class="card-header d-flex justify-content-between align-items-center"><div><h3 class="card-title mb-0">{{ title }}</h3>{% if subtitle %}<div class="text-secondary small mt-1">{{ subtitle }}</div>{% endif %}</div><span class="badge badge-soft-orange">دستی</span></div><div class="table-responsive"><table class="table table-vcenter mb-0 manual-table"><thead><tr><th>بابت</th><th>مبلغ</th><th>توضیح</th><th></th></tr></thead><tbody>{% for row in rows %}<tr><td><form id="finance-row-{{ row.id }}" method="post" action="{% url 'finance_accounts_action' %}">{% csrf_token %}<input type="hidden" name="action" value="save_row"><input type="hidden" name="id" value="{{ row.id }}"><input class="form-control form-control-sm" name="title" value="{{ row.title }}"></form></td><td><input form="finance-row-{{ row.id }}" class="form-control form-control-sm money" name="amount" value="{% if row.amount %}{{ row.amount }}{% endif %}" inputmode="numeric"></td><td><input form="finance-row-{{ row.id }}" class="form-control form-control-sm" name="note" value="{{ row.note }}"></td><td class="text-nowrap"><button form="finance-row-{{ row.id }}" class="btn btn-sm btn-primary" type="submit">ذخیره</button><form class="d-inline" method="post" action="{% url 'finance_accounts_action' %}">{% csrf_token %}<input type="hidden" name="action" value="delete_row"><input type="hidden" name="id" value="{{ row.id }}"><button class="btn btn-sm btn-ghost-danger" type="submit" onclick="return confirm('این ردیف حذف شود؟')">×</button></form></td></tr>{% empty %}<tr><td colspan="4" class="text-center text-secondary py-4">ردیفی ثبت نشده.</td></tr>{% endfor %}</tbody></table></div><div class="card-footer"><form method="post" action="{% url 'finance_accounts_action' %}" class="d-flex gap-2">{% csrf_token %}<input type="hidden" name="action" value="add_row"><input type="hidden" name="section" value="{{ section }}"><input class="form-control" name="title" placeholder="ردیف جدید..." required><button class="btn btn-outline-primary text-nowrap" type="submit">+ افزودن</button></form></div></div>
