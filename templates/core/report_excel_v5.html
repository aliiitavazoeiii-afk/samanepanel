{% extends 'core/report_excel_v3.html' %}{% load static %}
{% block content %}<script>(function(){try{if(sessionStorage.getItem('darma-report-v4-scroll')!==null){document.documentElement.style.visibility='hidden';}}catch(e){}})();</script>{{ block.super }}{% endblock %}
{% block scripts %}{{ block.super }}<script>document.addEventListener('DOMContentLoaded',function(){const f=document.querySelector('.capital-formula');if(f)f.textContent='حساب‌ها + کالای آماده + مواد اولیه + کالای سرمایه‌ای + طلب دیجی‌کالا − بدهی تکوین';document.querySelectorAll('.card').forEach(function(card){const title=card.querySelector('.card-title');if(title&&(title.textContent||'').trim()==='کالای سرمایه‌ای'){const muted=card.querySelector('.text-secondary');if(muted)muted.textContent='این بخش در سرمایه کل محاسبه می‌شود.';}});requestAnimationFrame(function(){requestAnimationFrame(function(){document.documentElement.style.visibility='visible';});});});setTimeout(function(){document.documentElement.style.visibility='visible';},350);</script>{% endblock %}
