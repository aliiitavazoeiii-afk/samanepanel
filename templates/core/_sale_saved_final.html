{% if pending %}<div class="border rounded-3 p-3 bg-warning-lt"><div class="fw-bold mb-2">کسری رنگ — انتخاب جایگزین</div>{% for s in pending %}<form class="d-flex flex-wrap align-items-end gap-2 mb-2" hx-post="{% url 'shortage_resolve' s.id %}" hx-target="closest td" hx-swap="innerHTML">{% csrf_token %}<div><label class="form-label mb-1">{{ s.source_color.name }} · کسری <span class="num">{{ s.qty }}</span></label><select class="form-select form-select-sm" name="target_color" required><option value="">رنگ جایگزین...</option>{% for c in colors %}{% if c.id != s.source_color_id %}<option value="{{ c.id }}">{{ c.name }}</option>{% endif %}{% endfor %}<option value="none">هیچ‌کدام — موجودی اصلی منفی شود</option></select></div><button class="btn btn-sm btn-primary">ثبت</button></form>{% endfor %}</div>{% else %}<span class="badge badge-soft-success">ذخیره و اعمال شد</span>{% if result.transferred %}<span class="badge badge-soft-orange ms-1">انتقال خودکار <span class="num">{{ result.transferred }}</span></span>{% endif %}{% endif %}
