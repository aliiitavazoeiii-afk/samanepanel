<div class="card mb-4 daily-order-upload-card">
  <div class="card-body p-3 p-md-4">
    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
      <div>
        <div class="page-kicker">ورود خودکار سفارش روزانه</div>
        <h3 class="mb-1">آپلود فایل اکسل دیجی‌کالا</h3>
        <div class="text-secondary small">
          اگر یک روز چند محموله داشتی، همه فایل‌های همان روز را با هم انتخاب کن. فایل‌ها با هم تجمیع می‌شوند و مجموع آن‌ها صورت کامل همان روز خواهد بود.
          آپلود دوباره همان مجموعه فایل باعث دوبرابرشدن نمی‌شود.
        </div>
      </div>
      <form method="post" enctype="multipart/form-data" action="{% url 'daily_order_import' day.id %}" class="daily-order-upload-form">
        {% csrf_token %}
        <div class="d-flex flex-column flex-md-row gap-2 align-items-stretch">
          <input class="form-control" type="file" name="orders_file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple required>
          <button class="btn btn-primary px-4" type="submit" onclick="return confirm('همه فایل‌های انتخاب‌شده با هم به‌عنوان صورت کامل این روز ثبت شوند؟')">
            <span class="btn-symbol">↑</span> ثبت خودکار فایل‌ها
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<style>
.daily-order-upload-card{border-color:rgba(251,101,20,.30)!important;background:linear-gradient(135deg,rgba(251,101,20,.075),rgba(10,28,49,.24))!important}
.daily-order-upload-form{min-width:min(100%,520px)}
@media(max-width:767.98px){.daily-order-upload-form{min-width:100%}.daily-order-upload-form .btn{width:100%}}
</style>
