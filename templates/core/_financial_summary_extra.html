{% load jalali %}<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 financial-tools-head"><div><div class="page-kicker mb-0">ابزار مالی</div><div class="text-secondary small">پرداخت‌ها و محاسبه سود تخفیف</div></div><div class="d-flex gap-2"><a class="btn btn-outline-light" href="{% url 'payments' %}">پرداختی‌ها</a><a class="btn btn-primary" href="{% url 'calculator' %}">محاسبه‌گر فروش</a></div></div><div class="row g-2 g-md-3 mb-4 financial-extra-row"><div class="col-12 col-md-6"><div class="card h-100"><div class="card-body"><div class="subheader">موجودی ملت</div><div class="kpi money mt-2">{{ mellat_balance|groupnum }}</div><div class="text-secondary small mt-1">تومان</div></div></div></div><div class="col-12 col-md-6"><div class="card h-100 {% if tailor_balance > 0 %}balance-receivable{% elif tailor_balance < 0 %}balance-payable{% endif %}"><div class="card-body"><div class="subheader">{% if tailor_balance > 0 %}طلب از خیاط{% elif tailor_balance < 0 %}بدهی به خیاط{% else %}بدهی / طلب از خیاط{% endif %}</div><div class="kpi money mt-2 {% if tailor_balance > 0 %}text-success{% elif tailor_balance < 0 %}text-danger{% endif %}">{{ tailor_balance|absnum|groupnum }}</div><div class="text-secondary small mt-1">تومان</div></div></div></div></div><style>.balance-receivable{border-color:rgba(18,183,106,.38)!important;box-shadow:0 18px 48px rgba(18,183,106,.08),inset 0 1px 0 rgba(255,255,255,.12)!important}.balance-payable{border-color:rgba(240,68,56,.42)!important;box-shadow:0 18px 48px rgba(240,68,56,.08),inset 0 1px 0 rgba(255,255,255,.12)!important}</style>
