<style>
/* Mobile-first polish for the Excel-Web UI. Included by active pages. */
.mobile-bottom-nav{display:none}
.mobile-only{display:none!important}
.desktop-only{display:block}
.mobile-scroll-note{display:none}

@media (max-width:991.98px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  body{padding-bottom:76px}
  .erp-main{width:100%;margin-right:0!important}
  .erp-content{padding:16px 12px 92px!important;max-width:100vw}
  .erp-topbar{height:58px!important;padding:0 10px!important;gap:8px}
  .erp-topbar>div:first-child>div{line-height:1.15}
  .erp-topbar>div:first-child>div>strong{font-size:.92rem}
  .erp-topbar>div:first-child>div>.small{font-size:.65rem}
  .erp-topbar>div:last-child{gap:6px!important}
  .erp-topbar>div:last-child .btn{min-height:38px;padding:.45rem .68rem;font-size:.75rem}
  .erp-topbar>div:last-child .btn-outline-light{display:none}
  .mobile-menu{width:40px;height:40px;display:inline-grid!important;place-items:center;padding:0;font-size:1.2rem}
  .erp-sidebar{width:min(86vw,320px)!important;padding:18px 12px!important;box-shadow:-18px 0 50px rgba(0,0,0,.40)}
  .erp-nav a{min-height:46px;padding:12px 13px!important;font-size:.92rem}
  .erp-nav-title{padding-top:14px!important}

  .page-title{font-size:1.45rem!important;line-height:1.25}
  .page-kicker{font-size:.72rem!important}
  .page-muted,.text-secondary{font-size:.82rem}
  .card{border-radius:14px!important}
  .card-header{min-height:52px!important;padding:11px 13px!important}
  .card-body{padding:14px!important}
  .card-footer{padding:11px 13px!important}
  .card-title{font-size:.96rem!important}
  .kpi{font-size:1.42rem!important;line-height:1.2}
  .subheader{font-size:.72rem}
  .row-cards{--tblr-gutter-x:10px;--tblr-gutter-y:10px}
  .btn{min-height:42px;border-radius:10px}
  .btn-sm{min-height:36px}
  .form-control,.form-select,.input-group-text{min-height:44px!important;font-size:16px!important}
  textarea.form-control{font-size:16px!important}

  .report-filter{width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important;padding:10px!important}
  .report-filter>div:first-child,.report-filter>button{grid-column:1/-1}
  .report-filter .form-control,.report-filter .form-select,.report-filter .btn{width:100%}

  .table-responsive,.excel-scroll{max-width:100%;overflow-x:auto!important;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(251,101,20,.55) rgba(255,255,255,.06)}
  .table-responsive::-webkit-scrollbar,.excel-scroll::-webkit-scrollbar{height:7px}
  .table-responsive::-webkit-scrollbar-thumb,.excel-scroll::-webkit-scrollbar-thumb{background:rgba(251,101,20,.55);border-radius:99px}
  .table-responsive::-webkit-scrollbar-track,.excel-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.05)}
  .excel-table{min-width:900px}
  .table-stock{min-width:620px}
  .manual-table{min-width:720px}
  .material-grid,.takvin-grid{min-width:920px!important}
  .material-grid .sticky-col,.takvin-grid .sticky-col,.table-stock th:first-child,.table-stock td:first-child{right:0!important;box-shadow:-8px 0 18px rgba(0,0,0,.16)}
  .grid-input{min-width:82px!important;min-height:40px;font-size:15px}
  .mobile-scroll-note{display:flex;align-items:center;gap:6px;color:#9fb0c4;font-size:.7rem;margin:0 3px 7px;padding:0 10px}
  .mobile-scroll-note:before{content:'↔';color:#fdb022;font-size:1rem}

  .capital-hero .card-body{display:block!important;padding:18px!important}
  .capital-number{font-size:1.8rem!important}
  .capital-side{min-width:0!important;grid-template-columns:1fr 1fr!important;margin-top:16px!important;gap:8px!important}
  .capital-side>div{padding:10px 11px!important}
  .summary-cell{padding:11px!important}
  .summary-cell strong{font-size:1.03rem!important}

  .chart-wrap{height:245px!important}
  .alert-list{max-height:none!important}
  .alert-item{padding:12px!important}
  .quick-card .card-body{min-height:118px}
  .quick-icon{width:36px!important;height:36px!important;border-radius:10px!important}

  .material-block>summary{padding:13px!important;gap:10px}
  .material-date{display:block;margin:3px 0 0!important}
  .material-toggle{white-space:nowrap}

  .mobile-only{display:block!important}
  .desktop-only{display:none!important}

  .mobile-bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:62px;z-index:1045;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:linear-gradient(135deg,rgba(10,30,52,.88),rgba(4,17,31,.80));backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 14px 42px rgba(0,0,0,.40);overflow:hidden}
  .mobile-bottom-nav a,.mobile-bottom-nav button{border:0;background:transparent;color:#9fb0c4;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;padding:4px 2px;min-width:0}
  .mobile-bottom-nav a.active{color:#fff;background:rgba(251,101,20,.10)}
  .mobile-bottom-nav .mn-icon{font-size:1.08rem;line-height:1}
  .mobile-bottom-nav .mn-label{font-size:.60rem;white-space:nowrap}
  .mobile-bottom-nav .mn-main .mn-icon{width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#fb6514,#f79009);color:#fff;display:grid;place-items:center;box-shadow:0 5px 16px rgba(251,101,20,.28)}

  /* Common page headers: controls below title instead of squeezing horizontally. */
  .mobile-page-head{align-items:stretch!important}
  .mobile-page-actions{width:100%;display:grid!important;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px!important}
  .mobile-page-actions .btn{width:100%}

  /* Date picker/popover compatibility with the global Jalali picker. */
  .jalali-picker,.jalali-datepicker,.date-picker-popover,.persian-datepicker{max-width:calc(100vw - 20px)!important;left:10px!important;right:10px!important;width:auto!important}
}

@media (max-width:575.98px){
  .erp-content{padding:13px 9px 90px!important}
  .page-title{font-size:1.3rem!important}
  .card-body{padding:12px!important}
  .kpi{font-size:1.28rem!important}
  .report-filter{grid-template-columns:1fr!important}
  .report-filter>*{grid-column:1!important}
  .capital-side{grid-template-columns:1fr!important}
  .chart-wrap{height:220px!important}
  .mobile-bottom-nav{left:7px;right:7px;bottom:calc(6px + env(safe-area-inset-bottom));height:60px;border-radius:16px}
  .mobile-bottom-nav .mn-label{font-size:.56rem}
}
</style>

<nav class="mobile-bottom-nav" aria-label="ناوبری موبایل">
  <a href="{% url 'dashboard' %}" class="{% if request.path == '/' %}active{% endif %}"><span class="mn-icon">⌂</span><span class="mn-label">داشبورد</span></a>
  <a href="{% url 'report' %}" class="{% if request.path == '/report/' %}active{% endif %}"><span class="mn-icon">▤</span><span class="mn-label">گزارش</span></a>
  <a href="{% url 'sale_start' %}" class="mn-main {% if '/sales/' in request.path %}active{% endif %}"><span class="mn-icon">＋</span><span class="mn-label">فروش</span></a>
  <a href="{% url 'inventory' %}" class="{% if '/inventory/' in request.path %}active{% endif %}"><span class="mn-icon">▦</span><span class="mn-label">موجودی</span></a>
  <button type="button" id="mobileBottomMenu"><span class="mn-icon">☰</span><span class="mn-label">منو</span></button>
</nav>
<script>
(function(){
  const btn=document.getElementById('mobileBottomMenu');
  if(!btn) return;
  btn.addEventListener('click',function(){
    document.getElementById('sidebar')?.classList.add('open');
    document.getElementById('sidebarBackdrop')?.classList.add('show');
  });
})();
</script>
