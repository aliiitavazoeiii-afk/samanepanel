{% load static %}<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101828"><title>ورود | DARMA General</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.rtl.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><link rel="stylesheet" href="{% static 'core/ui-polish.css' %}"><style>body{font-family:Vazirmatn,Tahoma,sans-serif;background:#101828}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);border:1px solid rgba(255,255,255,.10);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25);background:rgba(255,255,255,.97)}.brand-mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#ff812e,#fb6514);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:900;margin:auto;box-shadow:0 12px 30px rgba(251,101,20,.28)}.form-control{border-radius:10px;min-height:46px}</style></head><body><div class="login-wrap"><div class="w-100" style="max-width:430px"><div class="text-center mb-4 text-white"><div class="brand-mark mb-3">D</div><h1 class="mb-1">DARMA General</h1><div style="color:#98a2b3">سیستم مدیریت کسب‌وکار</div></div><form class="card login-card" method="post" autocomplete="off">{% csrf_token %}<div class="card-body p-4 p-md-5"><h2 class="mb-4">ورود به پنل</h2>{% if form.errors %}<div class="alert alert-danger">نام کاربری یا رمز عبور صحیح نیست.</div>{% endif %}<div class="mb-3"><label class="form-label">نام کاربری</label><input name="username" class="form-control" required autofocus></div><div class="mb-4"><label class="form-label">رمز عبور</label><input type="password" name="password" class="form-control" required></div><button type="submit" class="btn btn-primary btn-lg w-100">ورود</button></div></form></div></div></body></html>
