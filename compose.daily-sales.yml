services:
  samanepanel-daily-sales:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SALES_DB_PATH: /data/sales.sqlite3
      SALES_ADMIN_USER: ${SALES_ADMIN_USER:-admin}
      SALES_ADMIN_PASSWORD: ${SALES_ADMIN_PASSWORD:?Set SALES_ADMIN_PASSWORD in .env}
    volumes:
      - daily_sales_data:/data
    ports:
      - "127.0.0.1:8018:8018"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8018/daily-sales/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  daily_sales_data:
