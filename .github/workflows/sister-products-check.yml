name: Sister product master checks
on:
  push:
    branches: [dia-darma-fresh]
  workflow_dispatch:

jobs:
  sister-sales-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sister engine
        run: pip install -r deploy/darma-fresh/requirements.sister-sales.txt
      - name: Compile all sister modules
        run: python -m compileall -q daily_sales_service tests
      - name: Run legacy and master inventory regression tests
        env:
          SALES_MASTER_STRICT: '1'
        run: env -u SALES_START_EMPTY_STOCK python -m unittest discover -s tests -v
      - name: Verify FastAPI routes
        run: |
          python - <<'PY'
          from daily_sales_service.app import app
          from daily_sales_service.master_v2_api import router
          paths = {r.path for r in router.routes if hasattr(r,"path")}
          for suffix in ('/master', '/master/stock', '/master/stock/operations',
                         '/pricing', '/pricing/cost', '/pricing/sales', '/catalog'):
              assert '/daily-sales' + suffix in paths, suffix
          app_paths = {r.path for r in app.routes if hasattr(r,"path")}
          for suffix in ('/import', '/preview', '/commit'):
              assert '/daily-sales' + suffix in app_paths, suffix
          print('SISTER_PRODUCT_MASTER_ROUTES_OK')
          PY

  sister-django-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Django shell requirements
        run: pip install -r requirements.txt
      - name: Check sister Django routes and CSRF proxy
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DIA_DARMA_SSH_ONLY: '1'
        run: python manage.py test core.tests_sister_sales -v 2
      - name: Validate comprehensive sister capital template
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.template.loader import get_template
          from django.urls import reverse
          get_template("core/report_excel_sister_v1.html")
          for name in ("sister_product_platforms","sister_capital_report","sister_sales_site","sister_sales_basalam","sister_sales_ghaleb"):
              print(name,reverse(name))
          print("SISTER_DJANGO_SHELL_OK")
          PY
