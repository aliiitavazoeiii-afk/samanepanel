name: Sister product master checks
on:
  push:
    branches: [dia-darma-fresh]
  workflow_dispatch:

jobs:
  sister-sales-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sister engine
        run: pip install -r deploy/darma-fresh/requirements.sister-sales.txt
      - name: Compile all sister modules
        run: python -m compileall -q daily_sales_service tests
      - name: Run legacy and master inventory regression tests
        env:
          SALES_MASTER_STRICT: '1'
        run: env -u SALES_START_EMPTY_STOCK python -m unittest discover -s tests -v
      - name: Verify FastAPI routes
        run: |
          python - <<'PY'
          from daily_sales_service.app import app
          from daily_sales_service.master_v2_api import router
          paths = {r.path for r in router.routes if hasattr(r,"path")}
          for suffix in ('/master', '/master/stock', '/master/stock/operations',
                         '/pricing', '/pricing/cost', '/pricing/sales', '/catalog'):
              assert '/daily-sales' + suffix in paths, suffix
          app_paths = {r.path for r in app.routes if hasattr(r,"path")}
          for suffix in ('/import', '/preview', '/commit'):
              assert '/daily-sales' + suffix in app_paths, suffix
          print('SISTER_PRODUCT_MASTER_ROUTES_OK')
          PY

      - name: Live HTTP smoke for platform, pricing and inventory
        run: |
          pip install httpx
          python - <<'PY'
          import os,tempfile
          from datetime import date,timedelta
          from pathlib import Path
          from httpx import BasicAuth
          os.environ["SALES_ADMIN_PASSWORD"]="x"*32
          os.environ["SALES_ADMIN_USER"]="bridge"
          with tempfile.TemporaryDirectory() as temp:
              os.environ["SALES_DB_PATH"]=str(Path(temp)/"sister.sqlite3")
              from daily_sales_service.app import app
              from fastapi.testclient import TestClient
              from daily_sales_service.engine import dbconnect
              from daily_sales_service.master_v2_logic import add_model,sku_rows,batch_adjust,set_channel_prices
              auth=BasicAuth("bridge","x"*32)
              with TestClient(app) as client:
                  for url in ("/daily-sales/platforms","/daily-sales/platforms/site",
                              "/daily-sales/platforms/basalam","/daily-sales/platforms/mold",
                              "/daily-sales/pricing/cost","/daily-sales/capital-report",
                              "/daily-sales/api/sister-capital.json"):
                      response=client.get(url,auth=auth,follow_redirects=False)
                      assert response.status_code==200,(url,response.status_code,response.text[:200])
                  with dbconnect(os.environ["SALES_DB_PATH"]) as conn:
                      add_model(conn,"شورت زنانه دارما","مدل تست","","مشکی","M")
                      sku=sku_rows(conn,"شورت زنانه دارما")[0]
                      set_channel_prices(conn,"site","شورت زنانه دارما","","M",150000)
                      batch_adjust(conn,sku["category"],sku["id"],"M","home",{sku["id"]:9},"شمارش تست")
                  created=client.post("/daily-sales/platforms/site/add",auth=auth,
                      data={"master_id":sku["id"],"pack_qty":3,"title":"سه عددی تست",
                            "category":"شورت زنانه دارما"},follow_redirects=False)
                  assert created.status_code==303,created.text
                  with dbconnect(os.environ["SALES_DB_PATH"]) as conn:
                      listing_id=conn.execute("SELECT id FROM platform_listings WHERE channel='site'").fetchone()[0]
                  sale=client.post("/daily-sales/platforms/site/sales/add",auth=auth,
                      data={"listing_id":listing_id,"packs":2,"warehouse":"home",
                            "sale_date":date.today().isoformat(),"order_ref":"test-1"},
                      follow_redirects=False)
                  assert sale.status_code==303,sale.text
                  with dbconnect(os.environ["SALES_DB_PATH"]) as conn:
                      assert conn.execute("SELECT seller_stock FROM master_products WHERE id=?",(sku["id"],)).fetchone()[0]==3
                  tomorrow=(date.today()+timedelta(days=1)).isoformat()
                  cost=client.post("/daily-sales/pricing/cost/save",auth=auth,
                      data={"category":"شورت زنانه دارما","subtype":"","size":"*",
                            "cost":"80000","effective_date":tomorrow},
                      follow_redirects=False)
                  assert cost.status_code==303,cost.text
          print("SISTER_HTTP_PLATFORM_PRICING_SALES_OK")
          PY

  sister-django-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Django shell requirements
        run: pip install -r requirements.txt
      - name: Check sister Django routes and CSRF proxy
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DIA_DARMA_SSH_ONLY: '1'
        run: python manage.py test core.tests_sister_sales -v 2
      - name: Validate comprehensive sister capital template
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.template.loader import get_template
          from django.urls import reverse
          get_template("core/report_excel_sister_v1.html")
          for name in ("sister_product_platforms","sister_capital_report","sister_sales_site","sister_sales_basalam","sister_sales_ghaleb"):
              print(name,reverse(name))
          print("SISTER_DJANGO_SHELL_OK")
          PY
