name: dia-darma-fresh

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/app/deploy/darma-fresh/runtime_entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8000"

volumes:
  pgdata:
